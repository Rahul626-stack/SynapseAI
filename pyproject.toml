[project]
name = "synapse_ai"
version = "0.1.0"
description = "synapse.ai — Adaptive quiz generation powered by CrewAI + RAG + Bloom's Taxonomy"
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai>=0.121.1,<1.0.0",
    "streamlit>=1.32.0",
    "PyPDF2>=3.0.0",
    "PyYAML>=6.0.1",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "pypdf>=3.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.23.0",
    "langchain-text-splitters>=0.2.0",
    "plotly>=5.18.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
