pdf_analyzer_task:
  description: >
      Analyze the following retrieved context from a textbook on the topic "{topic}" and identify:
        1. Key concepts and topics
        2. Important facts and definitions
        3. Learning objectives
        4. Complex ideas that need to be tested
        
      --- RETRIEVED CONTEXT ---
      {context}
      --- END CONTEXT ---
      
      Provide a structured summary of the content that can be used to generate quizzes.
      
      The output should be a JSON object with:
      - key_concepts: List of main concepts and topics
      - important_facts: List of important facts and definitions
      - learning_objectives: List of learning objectives
      - complex_topics: List of complex topics that need testing
      - summary: A brief summary of the content
  expected_output: >
      A structured summary of the content that can be used to generate quizzes.
  agent: pdf_analyzer 


quiz_generator_task:
  description: >
      Using the analysis provided, create a comprehensive quiz of exactly {num_questions} questions on the topic "{topic}".
      
      Include the following question types: {question_types}
      
      CRITICAL QUESTION RULES:
      - multiple_choice: Must be a standard question with exactly 4 plausible options.
      - true_false: Must be a declarative statement that evaluates to true or false (e.g., "The Earth revolves around the Sun."), NOT a question (e.g., "Does the Earth revolve around the Sun?"). Options should not be provided, just the correct answer.
      - short_answer: Must be an open-ended question requiring a brief explanation.
      
      For each question:
      - Include the correct answer
      - Provide an explanation for the answer
      - Indicate the difficulty level (easy, medium, hard)
      - Tag with a Bloom's Taxonomy level
      
      {question_type_instructions}
      
      {bloom_instructions}
      
      {randomness_instruction}
      
      The output MUST be a JSON object with a list of questions, matching this exact template:
      {{
        "questions": [
          {{
            "question": "The question text or declarative statement",
            "type": "[MUST BE ONE OF THE REQUESTED TYPES: {question_types}]",
            "correct_answer": "The correct answer",
            "explanation": "Explanation of the answer",
            "difficulty": "easy | medium | hard",
            "options": ["Option A", "Option B", "Option C", "Option D"],
            "bloom_level": "Remember"
          }}
        ]
      }}
      Note: Omit the "options" field entirely for true_false and short_answer questions.

  expected_output: >
      A comprehensive quiz in strict JSON format with questions tagged by Bloom's Taxonomy level, including multiple question types, correct answers, explanations, and difficulty ratings.
  agent: quiz_generator